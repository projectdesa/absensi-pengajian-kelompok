<!DOCTYPE html>

<style>

:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1513;--sf:#142320;--tx:#e8f2ef;--mu:#8aa39d;--bd:#223632;--pr:#3fc3a8;--pr2:#17332e;--ok:#4ade9f;--okb:#12382b;--iz:#f0b955;--izb:#3a2e12;--al:#f08577;--alb:#3d1c18;--rail:#08201b;--railtx:#7fa89f}

.av{width:38px;height:38px;border-radius:50%;background:var(--pr2);color:var(--pr);display:grid;place-items:center;font-weight:800;flex:none}

.cf{color:var(--al);font-size:13px;font-weight:600}.yes,.no{border:0;border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px}.yes{background:var(--al);color:#fff}.no{background:var(--pr2);color:var(--pr)}
.don{display:flex;align-items:center;gap:18px;padding:16px;flex-wrap:wrap}
.dn{width:116px;height:116px;border-radius:50%;flex:none;display:grid;place-items:center}
.dn>div{width:80px;height:80px;border-radius:50%;background:var(--sf);display:grid;place-content:center;font-weight:800;font-size:21px;text-align:center;line-height:1.1}
.dn small{display:block;font-size:10.5px;font-weight:600;color:var(--mu)}
.lg{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.bars{display:flex;gap:6px;padding:14px 12px 10px;overflow-x:auto}
.bc{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bt{width:100%;max-width:44px;height:120px;border-radius:9px;background:var(--bg);border:1px solid var(--bd);display:flex;flex-direction:column-reverse;overflow:hidden}
.bt b{display:block}
.bv{font-size:12px;font-weight:800;min-height:18px}
.bl{font-size:11px;color:var(--mu);text-align:center;line-height:1.25}
.gr{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.gr .t{display:flex;justify-content:space-between;font-weight:600;font-size:13.5px;margin-bottom:5px}
.pt{height:10px;border-radius:6px;background:var(--bg);border:1px solid var(--bd);overflow:hidden}
.pt i{display:block;height:100%;background:var(--pr);border-radius:6px}
.pbar{display:inline-block;vertical-align:middle;width:56px;height:7px;border-radius:5px;background:var(--bg);border:1px solid var(--bd);margin-right:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok)}
main.full{max-width:none;padding:0;margin:0;width:100%}
.fi{border:1px solid var(--bd);background:var(--bg);border-radius:11px;padding:10px 12px;min-width:0;font:inherit;color:inherit}
.add .fi{flex:1;min-width:140px}
textarea.fi{resize:vertical}
.mf{padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}.mf .pb{align-self:flex-start}
.mt{padding:14px 16px;margin-bottom:10px}.mh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.mtt{font-weight:700;font-size:16px}.mt p{margin-top:8px;white-space:pre-wrap;font-size:14px}
.lw{width:100%;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr}
.lh{position:relative;overflow:hidden;background:linear-gradient(180deg,#0a2540 0%,#0f5c58 58%,#d9a95a 100%);color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.sk{position:absolute;inset:0;width:100%;height:100%}
.lh{align-items:center;text-align:center}.lh h1{font-family:Amiri,Georgia,"Times New Roman",serif;font-size:clamp(32px,4.4vw,46px);font-weight:700;line-height:1.2;max-width:14em;text-wrap:balance;position:relative;z-index:1;text-shadow:0 2px 14px rgba(0,0,0,.4)}.lh p{color:#cfe9e3;max-width:36ch}
.lh ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px;margin-top:10px}
.lh li{display:flex;align-items:center;gap:12px;font-weight:600}
.lh li svg{width:20px;height:20px;flex:none;padding:6px;box-sizing:content-box;border-radius:10px;background:rgba(255,255,255,.14)}
.lgo{position:relative;z-index:1;width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center}.lgo svg{width:30px;height:30px}
.lf{align-self:center;padding:40px;max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.lf h2{font-size:24px;font-weight:800}
.lf label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13.5px}
.le{color:var(--al);font-size:13.5px;min-height:20px;font-weight:600}
.hint{font-size:12.5px;color:var(--mu);background:var(--pr2);border-radius:10px;padding:9px 12px}
@media (max-width:760px){.lw{grid-template-columns:1fr}.lh{padding:40px 24px 130px;min-height:320px}.lf{padding:28px 20px}}
.mchip{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:12px}.mchip svg{width:22px;height:22px;color:var(--pr);flex:none}
.mf2{display:flex;flex-direction:column;gap:10px;margin-top:12px}.mb{margin-top:10px}.mb b{font-size:15.5px}
.st2{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:10px;z-index:30;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--sf);border:1px solid var(--bd);box-shadow:0 1px 5px rgba(0,0,0,.15);pointer-events:none}
.st2 i{width:8px;height:8px;border-radius:50%;background:currentColor}
.st2.ok{color:var(--ok)}.st2.iz{color:var(--iz)}.st2.al{color:var(--al)}.st2.mu{color:var(--mu)}
.st2 button{pointer-events:auto;border:0;background:var(--pr);color:#fff;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:700}
.ch button:disabled,.rs:disabled{opacity:.6;cursor:default}
.sv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-top:12px;flex-wrap:wrap}.sv.ok{border-color:var(--ok);background:var(--okb)}
.svb{position:sticky;bottom:calc(48px + env(safe-area-inset-bottom,0px));width:100%;padding:13px;margin-top:12px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:5}
.empty{padding:28px 16px;text-align:center;color:var(--mu)}
.sec{font-size:13px;font-weight:700;color:var(--mu);margin:16px 4px 8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:12px}
td:first-child,th:first-child{text-align:left}
tr:last-child td{border:0}
.m{display:inline-block;min-width:24px;border-radius:7px;font-weight:800;font-size:12px;padding:2px 0}
.m.H{background:var(--okb);color:var(--ok)}.m.I{background:var(--izb);color:var(--iz)}.m.A{background:var(--alb);color:var(--al)}.m.x{color:var(--mu)}
.all{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--ok);background:var(--okb);color:var(--ok);border-radius:13px;padding:10px;font-weight:700;margin-bottom:12px}.all svg{width:18px;height:18px}
.rs{flex-basis:100%;border:1px solid var(--iz);background:var(--izb);border-radius:10px;padding:8px 11px;font-size:13.5px;margin-left:48px}
.rn{flex:1;text-align:right;color:var(--mu);font-size:13.5px}
@media (max-width:480px){.rs{margin-left:0}.ch button{padding:6px 7px}.av{display:none}main{padding:18px 12px 40px}}
</style>
</head>
<body>
<nav class="rail" aria-label="Menu utama" id="rail"></nav>
<div id="st"></div>
<main id="app"></main>
<script>
var IC={
mosque:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-2 2-3 3.5-3 5.5a3 3 0 006 0C15 6.500 14 5 12 3z"/><path d="M4 21v-8l8-2 8 2v8M2 21h20M10 21v-4a2 2 0 014 0v4"/></svg>',
check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8.500 12.500l2.500 2.500 4.500-5"/></svg>',
users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.500"/><path d="M2.500 20a6.500 6.500 0 0113 0M16 4.500a3.500 3.500 0 010 7M18 14.500a6.500 6.500 0 013.500 5.500"/></svg>',
chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'};
var HARI=['Senin','Rabu','Jumat'],OFF=[0,2,4],BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var NL="Usep|Kiki|Masrandi|Jumari|Satria|Amiruddin|Ibra|Mustaqim|Wahyu|Galeh|Latif|Heru|Amin Iis|Jaya|Hadi|Munir|Amin Lilis|Marvel|Qodir|Ramadian|Ambo Alang|Rian|Fahrey|Jumardi|Jeje|Edy|Panca|Ilyas|Razka|Sodikin|Muslimin|Rifa’i|Sulaiman|Syahruddin|Sarifuddin".split('|');
var NP="Endang|Nani|Diana|Fida|Dilna|Keke|Badinah|Mare|Sari|Rohma|Sitti|Rukiyah|Aminah|Mika|Mita|Yati|Eka|Isnaini|Nilam|Lela|Lindi|Maskanah|Titis|Lilis|Miscel|Nurung|Marhuma|Baraiyah|Nuraini|Jija|Rita|Khusnul|Naimah|Dinul|Naura|Mala|Wati|Bella|Anggie|Ria|Inong|Ina|Mia|Tanawali|Ninda|Yunita".split('|'),M=[];
NL.forEach(function(n){M.push({id:M.length+1,n:n,g:'L'})});NP.forEach(function(n){M.push({id:M.length+1,n:n,g:'P'})});
var D={members:M,att:{},note:{},nid:M.length+1};
var LOC=null;
try{var sv=localStorage.getItem('absensi-pengajian-v2');if(sv){D=JSON.parse(sv);LOC=JSON.parse(sv)}}catch(e){}
D.materi=D.materi||[];D.note=D.note||{};D.fin=D.fin||{};D.auth=D.auth||{u:'admin',p:'admin123'};
try{var ss=localStorage.getItem('absensi-sess');if(ss!==null)D.sess=ss==='1'}catch(e){}
var DB=null,SY=false,OK=false,RO=false,SYS='wait',LATE=false,SN={mem:{},mat:{},auth:null,att:{}},PEND={},PT=0,Q={};
function save(){try{localStorage.setItem('absensi-sess',D.sess?'1':'');if(!SY)localStorage.setItem('absensi-pengajian-v2',JSON.stringify(D))}catch(e){}}
IC.book='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.500V5a2 2 0 012-2h14v14H6a2 2 0 00-2 2.500zM4 19.500A2 2 0 006 21h14v-4M9 8h7M9 12h5"/></svg>';
IC.out='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>';
var S={view:'absen',wk:0,day:0,g:'L',del:0,md:0,rp:'w',mo:0};
var td=new Date();
(function(){var d=(td.getDay()+6)%7;S.day=d>=4?2:d>=2?1:0})();
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function mon(){var d=new Date(td.getFullYear(),td.getMonth(),td.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7)+S.wk*7);return d}
function dt(i){var d=mon();d.setDate(d.getDate()+OFF[i]);return d}
function key(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function fm(d){return d.getDate()+' '+BLN[d.getMonth()]}
function stat(i,id){var a=D.att[key(dt(i))];return a&&a[id]||''}
function getNote(i,id){var n=D.note&&D.note[key(dt(i))];return n&&n[id]||''}
function setS(id,s){var k=key(dt(S.day));if(D.fin&&D.fin[k])return;D.att[k]=D.att[k]||{};if(D.att[k][id]===s)delete D.att[k][id];else D.att[k][id]=s;if(D.att[k][id]!=='I'&&D.note&&D.note[k])delete D.note[k][id];save();syncAtt(k,[id]);render();if(D.att[k][id]==='I'){var el=document.querySelector('[data-note="'+id+'"]');if(el)el.focus()}}
function setAll(){var k=key(dt(S.day));if(D.fin&&D.fin[k])return;D.att[k]=D.att[k]||{};var ch=[];D.members.forEach(function(m){if(m.g===S.g&&!D.att[k][m.id]){D.att[k][m.id]='H';ch.push(m.id)}});save();syncAtt(k,ch);render()}
function rail(){var items=[['absen','check','Absensi'],['jamaah','users','Jamaah'],['materi','book','Materi'],['rekap','chart','Rekap']];
document.getElementById('rail').innerHTML='<div class="logo">'+IC.mosque+'</div>'+items.map(function(x){return '<button class="nv" data-v="'+x[0]+'"'+(S.view===x[0]?' aria-current="page"':'')+'>'+IC[x[1]]+x[2]+'</button>'}).join('')+'<div class="sp"></div><button class="nv" data-a="logout">'+IC.out+'Keluar</button>'}
function weekBar(){var m=mon(),e=dt(2);return '<div class="card week"><button class="ib" data-a="prev" aria-label="Minggu sebelumnya">'+IC.left+'</button><div class="wl">'+fm(m)+' – '+fm(e)+' '+e.getFullYear()+'<small>'+(S.wk===0?'Minggu ini':S.wk<0?Math.abs(S.wk)+' minggu lalu':S.wk+' minggu lagi')+'</small></div><button class="ib" data-a="next" aria-label="Minggu berikutnya">'+IC.right+'</button></div>'}
function saveBar(c,n,fz){var d=dt(S.day),lb=HARI[S.day]+', '+fm(d);
if(fz){var w=new Date(fz);return '<div class="card sv ok"><div><b>Absensi '+lb+' sudah disimpan</b><div class="sub">Disimpan pukul '+('0'+w.getHours()).slice(-2)+'.'+('0'+w.getMinutes()).slice(-2)+'. Hadir '+c.H+', izin '+c.I+', alpa '+c.A+'.</div></div><button class="no" data-a="reopen">Ubah lagi</button></div>'}
var bl=n-c.H-c.I-c.A;
if(S.sv===S.wk+'-'+S.day)return '<div class="card sv"><div><b>Simpan absensi '+lb+'?</b><div class="sub">Hadir '+c.H+', izin '+c.I+', alpa '+c.A+(bl?'. '+bl+' jamaah belum ditandai.':'.')+'</div></div><div style="display:flex;gap:6px"><button class="pb" data-a="finok">Ya, simpan</button><button class="no" data-a="fincancel">Batal</button></div></div>';
